# TEMPLATE ONLY. Do not put real values here — this file is meant to be committed
# to git so teammates know which keys exist, with placeholder values only.
#
# To use it locally:
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # edit k8s/secret.yaml with real values
#   kubectl apply -f k8s/secret.yaml
#
# k8s/secret.yaml is in .gitignore so real values can never be committed by accident.
#
# `stringData` lets you write plain text here — Kubernetes base64-encodes it
# automatically when the object is created. Note this is encoding, not encryption:
# anyone with read access to Secrets in this namespace can decode the values.
# For real production use, prefer a proper secret manager (e.g. Sealed Secrets,
# External Secrets Operator, AWS/GCP/Azure secret managers) instead of plain
# Kubernetes Secrets.
apiVersion: v1
kind: Secret
metadata:
 name: python-k8s-app-secrets
type: Opaque
stringData:
  API_KEY: "replace-api-key"
  DB_USER: "appuser"
  DATABASE_PASSWORD: "admin123" 
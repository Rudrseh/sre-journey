apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-backend
  labels:
    app: python-backend
  annotations:
    description: "This is a deployment for python-backend"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: python-backend
  template:
    metadata:
      labels:
        app: python-backend
    spec:
      # Waits for Postgres to accept connections before the main container
      # starts, so pods don't crash-loop while the DB is still booting
      # (e.g. right after `kubectl apply` on a fresh cluster).
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          env:
            - name: PGHOST
              valueFrom:
                 configMapKeyRef:
                   name: python-k8s-app-configmap
                   value: DB_HOST
            - name: PGPORT
              valueFrom:
                 configMapKeyRef:
                   name: python-k8s-app-configmap
                   value: DB_PORT

            - name: PGUSER 
              valueFrom:
                 scretKeyRef:
                   name: python-k8s-app-secrets
                   value: DB_USER     
            - name: PGPASSWORD
              valueFrom:
                 secretKeyRef:
                   name: python-k8s-app-secrets
                   value: DB_PASSWORD
          command: 
             - sh
             - -c
             - | 
               until pg_isready - h "$PGHOST" -p "PGPORT" -U "PGUSER"; do
                echo "Waiting for postgres at $PGHOST:$PGPORT....."
                sleep 5
               done
      containers:
      - name: python-backend
        image: rudreshayd/darshimage:v1.1.0
        imagePullPolicy: always
        ports:
        - containerPort: 8000
        envFrom:
          - configMapRef:
               name: python-k8s-app-configmap
          - secretRef: 
               name: python-k8s-app-secrets
        resources:
          requests:
            memory: "100Mi"
            cpu: "128m"
          limits:
            memory: "250Mi"
            cpu: "256m"
        readinessProbe:
          httpGet: 
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3


      
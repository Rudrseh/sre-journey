apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  label:
    name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: python-k8s-app-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: python-k8s-app-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: python-k8s-app-secrets
                  key: DATABASE_PASSWORD
            # Keeps Postgres's files inside a subdirectory of the mount rather
            # than the mount root, which avoids issues with a stray
            # "lost+found" directory some storage provisioners create there.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["sh","-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$DB_NAME\""]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh","-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$DB_NAME\""]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes: 
        - name: postgres-storage
          persistentVolumeClaim: 
             claimName: postgres-pvc

apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-pythonapp-deployment
  labels:
    app: my-app
  annotations:
    description: "This is a deployment for my-app"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app-container
        image: rudreshayd/darshimage:v1.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
         - name: ENVIRONMENT
           value: "dev"
        resources:
          requests:
            memory: "100Mi"
            cpu: "128m"
          limits:
            memory: "250Mi"
            cpu: "256m"
        readinessProbe:
          httpGet: 
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3


      
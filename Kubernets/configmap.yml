apiVersion: v1
kind: ConfigMap
metadata:
  name: game-demo
data:
    player_initial_lives: "3"
    ui_properties_file_name: "user-interface.properties"

    game.properties: |
      enemies=aliens,monsters
      lives=3
      level=1
    
    game-ui.properties: |
      color=green
      width=800
      height=600
      

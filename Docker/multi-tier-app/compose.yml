version: "3.8"
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf 
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app-network
    
  web:
    build: ./app
    env_file:
      - .env
    environment:
       DATABASE_HOST: db
       CACHE_HOST: cache
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy  
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    networks:
      - app-network
    restart: unless-stopped

  
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.db:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    networks:
      - app-network
  
  cache:
    image: redis:7-alpine 
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:

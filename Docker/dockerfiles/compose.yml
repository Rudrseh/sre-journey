version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nginx-static:latest
    container_name: nginx_static
    ports:
      - "8080:80"
    environment:
      APP_NAME: "Nginx Static Site"
      APP_ENV: development
      NGINX_PORT: 80
    depends_on:
      - db
    volumes:
      - nginx_logs:/var/log/nginx
    labels:
      - "com.example.service=app"

  db:
    image: postgres:15-alpine
    container_name: pg_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data:
  nginx_logs:

networks:
  default:
    driver: bridge
